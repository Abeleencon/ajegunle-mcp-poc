# Role ARNs are filled in by the overlay from Terraform outputs (overlays/*/params.env).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-agent
  annotations:
    eks.amazonaws.com/role-arn: set-by-overlay
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  annotations:
    eks.amazonaws.com/role-arn: set-by-overlay
    eks.amazonaws.com/sts-regional-endpoints: "true"
