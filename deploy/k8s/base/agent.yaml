apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-agent
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-agent
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-agent
    spec:
      serviceAccountName: mcp-agent
      automountServiceAccountToken: true # IRSA needs the projected token
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-agent
      initContainers:
        # Native sidecar (restartPolicy: Always): starts before the agent, stops after it.
        # It binds 127.0.0.1 only, so nothing outside this pod can call the MCP tools.
        - name: mcp-server
          image: mcp-agent
          restartPolicy: Always
          command: ["python", "-m", "agent_service.mcp_server"]
          envFrom:
            - configMapRef:
                name: agent-params
          env:
            - name: MCP_HOST
              value: 127.0.0.1
            - name: MCP_PORT
              value: "8001"
            - name: OTEL_SERVICE_NAME
              value: mcp-runbooks
          startupProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: agent
          image: mcp-agent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent-params
          env:
            - name: MCP_SERVER_URL
              value: http://127.0.0.1:8001/mcp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: *restricted
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-agent
spec:
  selector:
    app.kubernetes.io/name: mcp-agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-agent
