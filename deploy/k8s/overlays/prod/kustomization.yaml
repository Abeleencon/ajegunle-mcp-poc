apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent
resources:
  - ../../base
configMapGenerator:
  - name: agent-params
    envs: [params.env]
images:
  - name: mcp-agent
    newName: 111122223333.dkr.ecr.us-east-1.amazonaws.com/mcp-agent # set by the deploy job
    newTag: set-by-deploy
replacements:
  - source:
      kind: ConfigMap
      name: agent-params
      fieldPath: data.AGENT_ROLE_ARN
    targets:
      - select: { kind: ServiceAccount, name: mcp-agent }
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
  - source:
      kind: ConfigMap
      name: agent-params
      fieldPath: data.COLLECTOR_ROLE_ARN
    targets:
      - select: { kind: ServiceAccount, name: otel-collector }
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
